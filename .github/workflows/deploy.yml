name: Deploy Quartz

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

# Change suggested by CoPilot 2026-02-10: set cancel-in-progress: false
# when troubleshooting why videos fail to appear on the blog
# Avoid canceling a build midway if you push again quickly.
# If you prefer auto-cancel, set cancel-in-progress: true

concurrency:
  group: "quartz-deploy"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --frozen-lockfile

      - name: Build Quartz site
        run: npx quartz build
        
        
# Optional: list the public folder for debugging on CI
      - name: Show public dir
        run: |
          echo "Top-level public/"
          ls -lah public || true
          echo "public/static/"
          ls -lah public/static || true
          echo "public/media/"
          ls -lah public/media || true
# end optional list
        

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
